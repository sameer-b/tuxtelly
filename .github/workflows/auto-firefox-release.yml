name: Auto-version Firefox releases
on:
  push:
    branches:
      - main
permissions:
  contents: write
  actions: write
concurrency:
  group: auto-firefox-release-main
  cancel-in-progress: false
jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Create the next version tag
        id: version
        env:
          PUSH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          git checkout -B release-source origin/main
          git merge-base --is-ancestor "$PUSH_SHA" HEAD

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { execFileSync } from "node:child_process";

          const run = (args) => execFileSync("git", args, { encoding: "utf8" }).trim();
          const pushedSha = process.env.PUSH_SHA;
          const tags = run(["tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"])
            .split("\n")
            .filter((tag) => /^v\d+\.\d+\.\d+$/.test(tag));

          for (const tag of tags) {
            const taggedSha = run(["rev-parse", `${tag}^{commit}`]);
            try {
              execFileSync("git", ["merge-base", "--is-ancestor", pushedSha, taggedSha]);
              console.log(`The pushed commit is already included in ${tag}; no duplicate release is needed.`);
              await writeFile(process.env.GITHUB_OUTPUT, "skip=true\n", { flag: "a" });
              process.exit(0);
            } catch (error) {
              if (error.status !== 1) throw error;
            }
          }

          const compare = (left, right) => {
            const a = left.split(".").map(Number);
            const b = right.split(".").map(Number);
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i];
            return 0;
          };
          const root = JSON.parse(await readFile("package.json", "utf8"));
          const extension = JSON.parse(await readFile("apps/extension/package.json", "utf8"));
          const corePath = "packages/core/src/index.ts";
          const core = await readFile(corePath, "utf8");
          const coreVersion = core.match(/export const VERSION = "([^\"]+)"/)?.[1];
          if ([root.version, extension.version, coreVersion].some((version) => version !== root.version)) {
            throw new Error("Root, extension, and core versions must match before auto-versioning.");
          }

          const latestTagVersion = tags
            .map((tag) => tag.slice(1))
            .sort(compare)
            .at(-1);
          let nextVersion = root.version;
          if (latestTagVersion && compare(nextVersion, latestTagVersion) <= 0) {
            const [major, minor, patch] = latestTagVersion.split(".").map(Number);
            nextVersion = `${major}.${minor}.${patch + 1}`;
          }
          const tag = `v${nextVersion}`;
          if (tags.includes(tag)) throw new Error(`Release tag ${tag} already exists.`);

          if (nextVersion !== root.version) {
            root.version = nextVersion;
            extension.version = nextVersion;
            await writeFile("package.json", `${JSON.stringify(root, null, 2)}\n`);
            await writeFile("apps/extension/package.json", `${JSON.stringify(extension, null, 2)}\n`);
            await writeFile(corePath, core.replace(/export const VERSION = "[^\"]+"/, `export const VERSION = "${nextVersion}"`));
            execFileSync("git", ["add", "package.json", "apps/extension/package.json", corePath]);
            execFileSync("git", ["commit", "-m", `chore(release): ${tag}`]);
            execFileSync("git", ["push", "origin", "HEAD:main"]);
          }

          execFileSync("git", ["tag", "-a", tag, "-m", `TuxTelly ${tag}`]);
          execFileSync("git", ["push", "origin", `refs/tags/${tag}`]);
          await writeFile(process.env.GITHUB_OUTPUT, `tag=${tag}\n`, { flag: "a" });
          console.log(`Created ${tag} at ${run(["rev-parse", "HEAD"])}.`);
          NODE
      - name: Start the signed release workflow
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run firefox-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$RELEASE_TAG"
