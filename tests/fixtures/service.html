<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TuxTelly fixture</title>
    <style>
      body {
        background: #121e17;
        color: #fff;
        font: 20px system-ui;
        padding: 32px;
      }
      nav {
        display: flex;
        gap: 24px;
      }
      button,
      input {
        font: inherit;
        padding: 15px;
      }
      video {
        display: block;
        width: 560px;
        margin-top: 30px;
      }
      #outside {
        position: absolute;
        left: 800px;
        top: 200px;
      }
    </style>
  </head>
  <body>
    <h1>Local streaming fixture</h1>
    <nav>
      <button id="card-one">First title</button
      ><button id="card-two">Second title</button
      ><button id="card-three">Third title</button>
    </nav>
    <p>
      <label>Search <input id="search" placeholder="Search titles" /></label>
    </p>
    <button id="play">Play sample</button
    ><video id="player" tabindex="0" controls preload="auto" src="/sample.webm">
      <track kind="captions" srclang="en" label="English" src="/captions.vtt" />
    </video>
    <p id="status">Ready</p>
    <script>
      document.querySelector("#play").onclick = async () => {
        await document.querySelector("video").play();
        document.querySelector("video").focus();
        document.querySelector("#status").textContent = "Playing";
      };
    </script>
  </body>
</html>
